server {
    listen      127.0.0.1:8080
    server_name localhost

    root        ../assets/html
    index       index.html
    allow_methods   GET POST DELETE
    client_max_body_size 10485760
    autoindex       off

    # Serve HTML pages from assets/html
    location /html {
        allow_methods   GET POST DELETE
        root            ../assets/html
        autoindex       off
    }

    # Serve image assets from assets/img
    location /img {
        allow_methods   GET
        root            ../assets/img
        autoindex       off
    }

    # Serve script files from assets/scripts
    location /scripts {
        allow_methods   GET POST
        root            ../assets/scripts
        autoindex       off
    }

    # Optional upload storage for non-CGI POST uploads
    location /uploads {
        allow_methods   GET POST DELETE
        root            ./www/uploads
        autoindex       on
        upload_store    ./www/uploads
    }

    # Example CGI location (if you want executable Python CGI later)
    # location /cgi-bin {
    #     allow_methods   GET POST
    #     root            ./assets/scripts
    #     cgi_pass        .py    /usr/bin/python3
    # }
}
